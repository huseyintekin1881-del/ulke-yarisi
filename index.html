function fsprite(code){
  if(FS[code]!==undefined)return FS[code];
  const S=200,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
  x.textAlign='center';x.textBaseline='middle';x.font='100px '+FONT;x.fillText(code,S/2,S/2+4);
  const d=x.getImageData(0,0,S,S).data;let x0=S,y0=S,x1=-1,y1=-1;
  for(let j=0;j<S;j++)for(let i=0;i<S;i++)if(d[(j*S+i)*4+3]>20){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}
  if(x1<0)return FS[code]=null;
  const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,-x0,-y0);
  return FS[code]=o;
}
let KUS=null;
function kuSprite(){ // Kürdistan bayrağı bir kez çizilir
  const w=240,h=164,c=document.createElement('canvas');c.width=w;c.height=h;const q=c.getContext('2d');
  q.fillStyle='#ed2024';q.fillRect(0,0,w,h/3);q.fillStyle='#fff';q.fillRect(0,h/3,w,h/3);q.fillStyle='#278e43';q.fillRect(0,2*h/3,w,h/3);
  q.fillStyle='#fbd30c';q.strokeStyle='#fbd30c';q.lineWidth=7;q.beginPath();q.arc(w/2,h/2,h*.2,0,6.28);q.fill();
  for(let k=0;k<21;k++){const a=k/21*6.28;q.beginPath();q.moveTo(w/2+Math.cos(a)*h*.22,h/2+Math.sin(a)*h*.22);q.lineTo(w/2+Math.cos(a)*h*.34,h/2+Math.sin(a)*h*.34);q.stroke()}
  q.strokeStyle='rgba(0,0,0,.35)';q.lineWidth=2;q.strokeRect(1,1,w-2,h-2);return c;
}

let AC=null,MG=null,mute=false,lastK=0;
function ac(){ // ilk dokunuşta sesi açar (iPhone için sessiz tampon da çalar)
  try{

  }catch(e){}

}

let MUS=null;const MUS_VOL=.22;
function startMusic(){
  if(MUS||!AC)return;
  const a=new Audio();a.preload='auto';
  let gn;
  try{const src=AC.createMediaElementSource(a);gn=AC.createGain();gn.gain.value=MUS_VOL;src.connect(gn);gn.connect(AC.destination)}catch(e){return}
  MUS={a,gn};
  const N=10,order=[];for(let i=1;i<=N;i++)order.push(i);
  const shuffle=()=>{for(let i=N-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}};
  shuffle();let idx=0,fail=0;
  const play=()=>{a.src='/muzik'+order[idx%N]+'.mp3';a.play().catch(()=>{})};
  a.addEventListener('ended',()=>{idx++;if(idx%N===0)shuffle();play()});
  a.addEventListener('error',()=>{fail++;idx++;if(fail<N)play()});
  a.addEventListener('playing',()=>{fail=0});
  play();
}
function ready(){return AC&&AC.state==='running'&&!mute}

let CROWD=null;
function loadCrowd(){ // taraftar kaydı: base64'ten çözülür
  if(CROWD!==null||!AC)return;CROWD=false;
  try{const bin=atob(CROWD_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    AC.decodeAudioData(u.buffer,b=>{CROWD=b},()=>{CROWD=null})}catch(e){CROWD=null}
}
function crowd(){ // bitişte taraftar sesi (sona doğru kısılarak biter)
  if(!ready()||!CROWD)return;const t=AC.currentTime,d=CROWD.duration,s=AC.createBufferSource(),gn=AC.createGain();
  s.buffer=CROWD;gn.gain.setValueAtTime(1,t);gn.gain.setValueAtTime(1,t+d-.04);gn.gain.linearRampToValueAtTime(0,t+d);
  s.connect(gn);gn.connect(MG);s.start(t);
}
function sWin(){crowd()}

function pop(x,y,col,n){if(parts.length>160)return;for(let k=0;k<(n||12);k++){const a=Math.random()*6.28,s=2+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:col})}}
const MEDAL=['#ffd400','#c9d1d9','#cd7f32'];
function recalc(){order=P.slice().sort((a,b)=>b.w-a.w||a.lw-b.lw||a.i-b.i);RK=order.filter(p=>p.w>0).slice(0,3);MED.fill(null);RK.forEach((p,k)=>{MED[p.i]=MEDAL[k]});DIRTY=false}
function shade(h,a){const n=parseInt(h.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(a<0?v*(1+a):v+(255-v)*a)));return 'rgb('+f(n>>16)+','+f((n>>8)&255)+','+f(n&255)+')'}
function pent(q,cx,cy,R,rot){q.beginPath();for(let k=0;k<5;k++){const a=rot+k*1.2566,px=cx+Math.cos(a)*R,py=cy+Math.sin(a)*R;k?q.lineTo(px,py):q.moveTo(px,py)}q.closePath()}
const BS={};
function ballSprites(col){ // her top rengi bir kez çizilir, sonra sadece kopyalanır
  const key=col||'w';if(BS[key])return BS[key];
  const R=24,S=R*2+6,mk=()=>{const c=document.createElement('canvas');c.width=c.height=S;return c};
  const base=mk(),pat=mk(),top=mk(),a=base.getContext('2d'),b=pat.getContext('2d'),t=top.getContext('2d'),cx=S/2;
  const bc=col||'#f4f6f8',gr=a.createRadialGradient(cx-R*.35,cx-R*.4,R*.1,cx,cx,R);
  gr.addColorStop(0,shade(bc,.55));gr.addColorStop(.5,bc);gr.addColorStop(1,shade(bc,-.35));
  a.fillStyle=gr;a.beginPath();a.arc(cx,cx,R,0,6.28);a.fill();
  const dk=col?shade(col,-.62):'#1a1d22';
  b.translate(cx,cx);b.beginPath();b.arc(0,0,R,0,6.28);b.clip();b.fillStyle=dk;b.strokeStyle=dk;b.lineWidth=Math.max(1,R*.07);
  pent(b,0,0,R*.36,-1.5708);b.fill();
  for(let k=0;k<5;k++){const va=-1.5708+k*1.2566,a2=va+.6283;b.beginPath();b.moveTo(Math.cos(va)*R*.36,Math.sin(va)*R*.36);b.lineTo(Math.cos(va)*R*.68,Math.sin(va)*R*.68);b.stroke();pent(b,Math.cos(a2)*R*1.02,Math.sin(a2)*R*1.02,R*.42,a2+Math.PI);b.fill()}
  t.fillStyle='rgba(255,255,255,.6)';t.beginPath();t.ellipse(cx-R*.38,cx-R*.48,R*.24,R*.15,-.6,0,6.28);t.fill();
  t.strokeStyle='rgba(0,0,0,.55)';t.lineWidth=2;t.beginPath();t.arc(cx,cx,R,0,6.28);t.stroke();
  return BS[key]={base,pat,top,S,R};
}
function ball(x,y,col,r,rot){
  r=r||8;const s=ballSprites(col),d=s.S*r/s.R;
  g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(x,y+r*.95,r*.95,r*.28,0,0,6.28);g.fill();
  g.drawImage(s.base,x-d/2,y-d/2,d,d);
  g.save();g.translate(x,y);g.rotate(rot||0);g.drawImage(s.pat,-d/2,-d/2,d,d);g.restore();
  g.drawImage(s.top,x-d/2,y-d/2,d,d);
}
let PC=null;
function buildPitch(){
  const c=document.createElement('canvas');c.width=W;c.height=PITCH_H;const q=c.getContext('2d');
  const GL=W-20,MID=PITCH_H/2;
  // çim: dikey derinlik + biçme şeritleri + hafif doku
  const base=q.createLinearGradient(0,0,0,PITCH_H);base.addColorStop(0,'#1c7032');base.addColorStop(.5,'#25883c');base.addColorStop(1,'#1c7032');
  q.fillStyle=base;q.fillRect(0,0,W,PITCH_H);
  for(let k=0;k<13;k++){q.fillStyle=k%2?'rgba(255,255,255,.055)':'rgba(0,0,0,.065)';q.fillRect(GX+k*100,0,100,PITCH_H)}
  for(let i=0;i<N;i+=2){q.fillStyle='rgba(255,255,255,.03)';q.fillRect(GX,i*LH,W-GX,LH)}
  for(let k=0;k<2600;k++){q.fillStyle=Math.random()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.06)';q.fillRect(GX+Math.random()*(W-GX),Math.random()*PITCH_H,2,2)}
  // şerit çizgileri (saha çizgilerinden biraz silik)
  q.strokeStyle='rgba(255,255,255,.55)';q.lineWidth=3;
  for(let i=1;i<N;i++){q.beginPath();q.moveTo(GX,i*LH);q.lineTo(GL,i*LH);q.stroke()}
  // saha çizgileri
  q.strokeStyle='rgba(255,255,255,.95)';q.lineWidth=4;q.fillStyle='rgba(255,255,255,.95)';
  q.strokeRect(GX+2,2,GL-GX-2,PITCH_H-4);
  q.beginPath();q.arc(GX+2,MID,90,-Math.PI/2,Math.PI/2);q.stroke();
  q.beginPath();q.arc(GX+2,MID,6,0,6.28);q.fill();
  q.strokeRect(GL-240,MID-250,240,500);
  q.strokeRect(GL-100,MID-110,100,220);
  q.beginPath();q.arc(GL-150,MID,5,0,6.28);q.fill();
  q.beginPath();q.arc(GL-150,MID,110,2.53,3.75);q.stroke();
  q.beginPath();q.arc(GL,2,18,Math.PI/2,Math.PI);q.stroke();
  q.beginPath();q.arc(GL,PITCH_H-2,18,Math.PI,Math.PI*1.5);q.stroke();
  // kale ve ağ
  q.fillStyle='rgba(255,255,255,.12)';q.fillRect(GL,MID-110,20,220);
  q.strokeStyle='rgba(255,255,255,.45)';q.lineWidth=1;
  for(let y=MID-110;y<=MID+110;y+=12){q.beginPath();q.moveTo(GL,y);q.lineTo(W,y);q.stroke()}
  for(let x=GL;x<=W;x+=10){q.beginPath();q.moveTo(x,MID-110);q.lineTo(x,MID+110);q.stroke()}
  q.strokeStyle='#fff';q.lineWidth=3;q.strokeRect(GL,MID-110,19,220);
  // damalı bitiş çizgisi
  const fx=GL-20,sq=10;
  for(let j=0;j*sq<PITCH_H;j++)for(let k=0;k<2;k++){q.fillStyle=(j+k)%2?'#111':'#fff';q.fillRect(fx+k*sq,j*sq,sq,Math.min(sq,PITCH_H-j*sq))}
  // kenarlarda hafif karartma (vinyet)
  const v=q.createRadialGradient(W/2,MID,220,W/2,MID,820);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.32)');
  q.fillStyle=v;q.fillRect(0,0,W,PITCH_H);
  return c;
}
function pitch(){g.drawImage(PC||(PC=buildPitch()),0,0)}
function giftCol(){
  g.fillStyle='#0d2a16';g.fillRect(0,0,GX,PITCH_H);

function player(p,running,medal){
  const m=IM[C[p.i][1]],x=p.x,y=cy(p.i),bob=running?-Math.abs(Math.sin(p.run))*6:0;

const slotH=[0,0,0];
// kırmızı -> açık -> mavi geçişli çubuk renkleri
const BC=[['#e2505f','#b51c32'],['#ecb6ba','#d27f88'],['#9bbbe0','#3d78bd']];
function barPath(x,y,w,h,r){r=Math.min(r,h);g.beginPath();g.moveTo(x,y+h);g.lineTo(x,y+r);g.arcTo(x,y,x+r,y,r);g.lineTo(x+w-r,y);g.arcTo(x+w,y,x+w,y+r,r);g.lineTo(x+w,y+h);g.closePath()}
function board(r){
  const y0=PITCH_H+132,maxH=92,bw=130,gap=200,cx0=W/2-gap;
  g.fillStyle='#0d2a16';g.fillRect(0,PITCH_H,W,H-PITCH_H);
  g.fillStyle='#fff';g.fillRect(0,H-4,W,4);
  for(let k=0;k<3;k+=2){g.fillStyle='rgba(255,255,255,.045)';g.fillRect(cx0+k*gap-gap/2,PITCH_H+4,gap,y0-PITCH_H-4)}
  g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1.5;g.setLineDash([4,4]);
  g.beginPath();g.moveTo(cx0-gap/2,y0-maxH);g.lineTo(cx0+2.5*gap,y0-maxH);g.stroke();g.setLineDash([]);
  g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=2;g.beginPath();g.moveTo(cx0-gap/2,y0);g.lineTo(cx0+2.5*gap,y0);g.stroke();
  for(let j=0;j<4;j++){const x=cx0-gap/2+j*gap;g.beginPath();g.moveTo(x,y0);g.lineTo(x,y0+8);g.stroke()}
  for(let k=0;k<3;k++){
    const cx=cx0+k*gap,p=r[k];
    const target=p?40+(maxH-40)*p.w/r[0].w:6;
    slotH[k]+=(target-slotH[k])*(1-Math.pow(.88,DT));const h=slotH[k];
    if(p){
      let gc=GCH[k];if(!gc||Math.abs(gc.h-h)>.4){const gr=g.createLinearGradient(0,y0-h,0,y0);gr.addColorStop(0,BC[k][0]);gr.addColorStop(1,BC[k][1]);gc=GCH[k]={h,gr}}
      g.fillStyle=gc.gr;barPath(cx-bw/2,y0-h,bw,h,10);g.fill();
      g.font='bold 26px sans-serif';g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=5;g.strokeStyle='rgba(0,0,0,.55)';g.strokeText((k+1)+'#',cx,y0-20);g.fillStyle=MEDAL[k];g.fillText((k+1)+'#',cx,y0-20);g.lineJoin='miter';
      g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.font='bold 26px sans-serif';g.fillText(p.w,cx,y0-h-16);
      g.fillStyle='#fff';flag(C[p.i][0],cx,y0+37,30);
    }else{
      g.fillStyle='#1f4a2e';barPath(cx-bw/2,y0-h,bw,h,3);g.fill();
    }
  }
}
let DT=1,LAST=0,RP=0;
let LASTF=0,RAF=0;const FPS=30,FDT=1000/FPS-3; // FPS: gerekirse 24 yap, daha da hafifler
function frame(){
  RAF=0;const _n=performance.now();if(_n-LASTF<FDT){RAF=requestAnimationFrame(frame);return}LASTF=_n; // 30 kare/sn: telefonu daha az yorar
  clock++;if(MUS&&MUS.m!==mute){MUS.m=mute;MUS.gn.gain.value=mute?0:MUS_VOL}const _t=performance.now();DT=LAST?Math.min(2.5,(_t-LAST)/16.667):1;LAST=_t;
  if(DIRTY)recalc();
  order.forEach((p,k)=>{const ty=k*LH+LH/2;p.ly+=(ty-p.ly)*(1-Math.pow(.88,DT));if(Math.abs(ty-p.ly)<.3)p.ly=ty});
  const r=RK;
  g.save();g.translate(0,H-PITCH_H);
  pitch();
  P.forEach(p=>{if(p.fl>0){g.fillStyle='rgba(255,212,0,'+(p.fl/40)+')';g.fillRect(GX,p.ly-LH/2,W-GX,LH);p.fl-=DT}});
  P.forEach(p=>{const s=nameSp(p.i,40,8);g.drawImage(s,(START+FIN)/2-s.width/2,p.ly+2-s.height/2)});
  giftCol();
  P.forEach(p=>{
    const tx=START+Math.min(p.t,STEPS)*STEP,d=tx-p.x;let running=false;
    if(Math.abs(d)<=1.5)p.x=tx;
    else{p.x+=Math.sign(d)*Math.min(Math.abs(d),Math.max(1.5*DT,Math.abs(d)*(1-Math.pow(.88,DT))));p.run+=.55*DT;running=true}
    if(p.t>=STEPS&&p.x>=FIN-1){p.w++;p.lw=Date.now();p.t-=STEPS;p.x=START;p.fl=40;DIRTY=true;save();sWin();
      for(let k=0;k<4;k++)pop(FIN+40,cy(p.i),['#ffd400','#fff','#ff4d6d','#4dd2ff'][k],10)}
    player(p,running,MED[p.i]);
  });
  bubbles=bubbles.filter(b=>{
    const p=P[b.i];b.x+=b.vx*DT;const y=cy(b.i);
    g.fillStyle='rgba(255,255,255,.18)';g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=3;
    g.beginPath();g.arc(b.x,y,b.r+6,0,6.28);g.fill();g.stroke();
    g.fillStyle='#fff';flag(C[b.i][0],b.x,y,34);
    if(b.x+b.r+6>=p.x-22){pop(p.x-22,y,'#fff');p.t++;p.at=clock;sKick();return false}
    return true;
  });
  parts=parts.filter(q=>{q.x+=q.vx*DT;q.y+=q.vy*DT;q.vy+=.15*DT;q.l-=.025*DT;
    g.globalAlpha=Math.max(q.l,0);g.fillStyle=q.c;g.beginPath();g.arc(q.x,q.y,4,0,6.28);g.fill();g.globalAlpha=1;return q.l>0});
  g.restore();g.save();g.translate(0,-PITCH_H);board(r);{const on=AC&&AC.state==='running'&&!mute,sp=fsprite(on?'🔊':'🔇');if(sp){const h=26,w=h*sp.width/sp.height;g.globalAlpha=on?.5:.55+.4*Math.sin(clock/8);g.drawImage(sp,W-32-w/2,PITCH_H+30-h/2,w,h);g.globalAlpha=1}}
  {const sp=fsprite('🔄');g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.arc(45,PITCH_H+30,22,0,6.28);g.fill();
   if(sp){const h=24*(1+(RP>0?RP*.03:0)),w=h*sp.width/sp.height;g.globalAlpha=.6;g.drawImage(sp,45-w/2,PITCH_H+30-h/2,w,h);g.globalAlpha=1}if(RP>0)RP-=DT}g.restore();
  RAF=requestAnimationFrame(frame);

// ===== TikTok köprüsü: hediye gelince gift(i) çağrılır =====
// Sıra: 0 Türkiye-Gül, 1 Amerika-Pençe, 2 İsrail-Seni Seviyorum, 3 Filistin-Dondurma, 4 Azerbaycan-TikTok,
// 5 Kürdistan-Lazer Çubuğu, 6 Suudi-GG, 7 Hindistan-Lale, 8 Ukrayna-Pati, 9 Rusya-Karşılama Kahvesi
// Eşleştirme hediye ID'sine göre yapılır (en sağlamı). ID tutmazsa ad yedek olarak denenir.
const GIFT_IDS=[5655,1485682,15231,5827,5269,6788,6064,15948,1485683,919346];
const GIFT_NAMES=[
 ['rose','gül'],
 ['paws','pençe'],
 ['love you','seni seviyorum'],
 ['ice cream cone','dondurma külahı'],
 ['tiktok'],
 ['laser wand','lazer çubuğu'],
 ['gg'],
 ['tulip','lale'],
 ['pati'],
 ['welcome coffee','karşılama kahvesi']
];
function giftIndex(id,name){
  let i=GIFT_IDS.indexOf(Number(id));
  if(i>=0)return i;
  const n=String(name||'').toLowerCase().trim();
  return GIFT_NAMES.findIndex(a=>a.includes(n));
}
let WS=null,WST=0;
function connectWS(){
  if(WST){clearTimeout(WST);WST=0}
  if(WS&&WS.readyState<2)return;
  let ws;
  try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host)}catch(e){WST=setTimeout(connectWS,5000);return}
  WS=ws;
  ws.onmessage=e=>{
    try{
      const v=JSON.parse(e.data);
      if(v.tip!=='hediye')return;
      const i=giftIndex(v.id,v.hediye);
      if(i<0)return;
      const n=Math.min(v.adet||1,10);
      for(let k=0;k<n;k++)setTimeout(()=>gift(i),k*250);
    }catch(err){}
  };
  ws.onclose=()=>{if(WS===ws){WS=null;if(!document.hidden)WST=setTimeout(connectWS,3000)}};
  ws.onerror=()=>{try{ws.close()}catch(e){}};
}
connectWS();
